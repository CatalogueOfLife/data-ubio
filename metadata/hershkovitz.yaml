title: "Catalog of Living Whales (Hershkovitz 1966)"
alias: Hershkovitz Whales
description: >-
  Philip Hershkovitz (1966), Catalog of Living Whales. Bulletin of the United States National Museum 246: 1-259.
  uBio transcribed the catalogue into its ClassificationBank (classification 57) and into a separate database that
  holds type material, type localities, distributions and the full chresonymy.

  This archive was generated from the November 2015 uBio database dump. Accepted names, synonyms, chresonymy
  references, type material and distributions are included. Record identifiers are uBio NameBank identifiers.
  Synonym records are prefixed with "s".
