description: >-
  Transcribed by uBio (Universal Biological Indexer and Organizer, MBLWHOI Library, Marine Biological Laboratory,
  Woods Hole) into its ClassificationBank as classification {cid} (group: {group}).
  This archive was generated from the November 2015 uBio database dump.
  Record identifiers are uBio NameBank identifiers (namebankID); synonym records are prefixed with "s".
