conversion:
  description: >-
    Converted with a Python and DuckDB script from the November 2015 MySQL dump of the uBio databases. The uBiota
    classification (ClassificationBank 104) provides the accepted taxa, after repairing duplicate placements and
    missing parents. All other NameBank scientific names are added as bare names. Superseded NameBank records are
    redirected to their current identifier. Vernacular names are kept only for taxa in uBiota. Misspelling, lexical-
    variant and basionym groups become name relations, and external database mappings become alternative
    identifiers.
  url: https://github.com/CatalogueOfLife/data-ubio
